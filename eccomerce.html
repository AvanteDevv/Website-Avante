<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Cards horizontales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ruda:wght@400;600;700&family=Fraunces:opsz,wght@9..144,300..700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary-bg: #fff;
  --card-bg-odd: #bfbfbf;
  --card-bg-even: #f2f2f2;

  --scale-level-1: 1.2;
  --scale-level-2: 1;
  --scale-level-3: 0.8;

  --rotate-level-1: 0deg;
  --rotate-level-2: 15deg;
  --rotate-level-3: 30deg;

  --position-x-level-1: 0;
  --position-x-level-2: 2rem;
  --position-x-level-3: 4rem;

  --position-y-level-1: 0;
  --position-y-level-2: 2rem;
  --position-y-level-3: 10rem;

  --active-scale: 1.35;
  --active-position-y: -2rem;

  --not-active-scale-offset: 0.15;

  /* Avante — Directorio */
  --blue-900:#000850;
  --blue-700:#0015E0;
  --blue-600:#041cff;
  --blue-500:#3E50FF;
  --blue-300:#8992FF;
  --blue-100:#EAEFFF;
  --blue-50:#F5F7FF;
  --ink:#0A0E38;
  --grey:#6670A6;
  --line:#DDE3FA;
  --white:#FFFFFF;
  --serif:'Fraunces', serif;
  --sans:'Public Sans', sans-serif;
  --ease:cubic-bezier(.16,.84,.44,1);
}

* {
  box-sizing: border-box;
}

a {
  color: inherit;
  text-decoration: none;
}

body {
  margin: 0;
  background-color: var(--primary-bg);
  font-family: "Ruda", serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 6vw;
}

.navbar {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 1.2vw 2.5vw;
  box-sizing: border-box;
}

.navbar .top-logo {
  grid-column: 2;
}

.navbar .shop-btn {
  grid-column: 3;
  justify-self: end;
  display: inline-flex;
  align-items: center;
  gap: 0.4vw;
  background-color: #000;
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 0.55vw 1.1vw;
  font-family: "Ruda", serif;
  font-size: 0.75vw;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}

.navbar .shop-btn i {
  font-size: 0.7vw;
}

@media (max-width: 700px) {
  .navbar .shop-btn {
    font-size: 3vw;
    padding: 2vw 3.5vw;
  }
  .navbar .shop-btn i {
    font-size: 2.8vw;
  }
}

.navbar .top-logo {
  height: 1.6vw;
  min-height: 20px;
  max-height: 32px;
  width: auto;
  display: block;
}

.cards-wrapper {
  margin-top: 3vw;
}

.cards-wrapper {
  position: relative;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  place-content: center;
}

.card {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.7vw;
  padding: max(1.2vw, 0.75rem);
  border-radius: 1.6vw;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  height: 10vw;
  min-height: 125px;
  transition: transform 0.3s, background-color 0.3s;
}

.card .header {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 0.5vw;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}

.card .header .header-text .text-main {
  display: block;
  font-size: max(0.95vw, 0.45rem);
}

.card .header .header-text .text-sub {
  display: block;
  font-size: 0.6vw;
  margin-top: 0.1rem;
  color: #606060;
}

.card .header .header-icon-btn {
  border: none;
  padding: 0;
  background-color: #a6a6a6;
  width: 1.7vw;
  height: 1.7vw;
  border-radius: 50%;
  outline: 1px dashed transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.3s, outline 0.3s;
}

.card .header .header-icon-btn:before {
  content: "";
  position: absolute;
  background-color: #ffb6c1;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  transform: scale(0);
  transition: transform 0.3s;
}

.card .header .header-icon-btn i {
  position: relative;
  font-size: 0.8vw;
  transition: color 0.3s;
}

.card .header .header-icon-btn:hover:before {
  transform: scale(1);
}

.card .header .header-icon-btn:hover i {
  color: #ff1493;
}

.card .header .header-icon-btn:active {
  transform: translateY(2px);
  outline-color: #ff69b4;
}

.card .avatar-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
  z-index: 0;
}

.card:before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background-color: #000;
  left: 0;
  top: 0;
  border-radius: 2vw;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s;
  z-index: 1;
}

.card:nth-child(odd) {
  background-color: var(--card-bg-odd);
}
.card:nth-child(even) {
  background-color: var(--card-bg-even);
}

.card:nth-child(3) {
  transform: scale(var(--scale-level-1)) rotate(var(--rotate-level-1))
    translateX(var(--position-x-level-1))
    translateY(var(--position-y-level-1));
  z-index: 10;
}
.card:nth-child(3).active {
  transform: scale(var(--active-scale)) rotate(0)
    translateX(var(--position-x-level-1))
    translateY(var(--active-position-y));
  z-index: 20;
}
.card:nth-child(3).not-active {
  transform: scale(calc(var(--scale-level-1) - var(--not-active-scale-offset)))
    rotate(var(--rotate-level-1)) translateX(var(--position-x-level-1))
    translateY(var(--position-y-level-1));
}

.card:nth-child(2) {
  transform: scale(var(--scale-level-2))
    rotate(calc(-1 * var(--rotate-level-2)))
    translateX(var(--position-x-level-2))
    translateY(var(--position-y-level-2));
  z-index: 5;
}
.card:nth-child(2).active {
  transform: scale(var(--active-scale)) rotate(0)
    translateX(var(--position-x-level-2))
    translateY(var(--active-position-y));
  z-index: 20;
}
.card:nth-child(2).not-active {
  transform: scale(calc(var(--scale-level-2) - var(--not-active-scale-offset)))
    rotate(calc(-1 * var(--rotate-level-2)))
    translateX(var(--position-x-level-2))
    translateY(var(--position-y-level-2));
}

.card:nth-child(4) {
  transform: scale(var(--scale-level-2)) rotate(var(--rotate-level-2))
    translateX(calc(-1 * var(--position-x-level-2)))
    translateY(var(--position-y-level-2));
  z-index: 5;
}
.card:nth-child(4).active {
  transform: scale(var(--active-scale)) rotate(0)
    translateX(var(--position-x-level-2))
    translateY(var(--active-position-y));
  z-index: 20;
}
.card:nth-child(4).not-active {
  transform: scale(calc(var(--scale-level-2) - var(--not-active-scale-offset)))
    rotate(var(--rotate-level-2))
    translateX(calc(-1 * var(--position-x-level-2)))
    translateY(var(--position-y-level-2));
}

.card:nth-child(1) {
  transform: scale(var(--scale-level-3))
    rotate(calc(-1 * var(--rotate-level-3)))
    translateX(var(--position-x-level-3))
    translateY(var(--position-y-level-3));
  z-index: 1;
}
.card:nth-child(1).active {
  transform: scale(var(--active-scale)) rotate(0)
    translateX(var(--position-x-level-3))
    translateY(var(--active-position-y));
  z-index: 20;
}
.card:nth-child(1).not-active {
  transform: scale(calc(var(--scale-level-3) - var(--not-active-scale-offset)))
    rotate(calc(-1 * var(--rotate-level-3)))
    translateX(var(--position-x-level-3))
    translateY(var(--position-y-level-3));
}

.card:nth-child(5) {
  transform: scale(var(--scale-level-3)) rotate(var(--rotate-level-3))
    translateX(calc(-1 * var(--position-x-level-3)))
    translateY(var(--position-y-level-3));
  z-index: 1;
}
.card:nth-child(5).active {
  transform: scale(var(--active-scale)) rotate(0)
    translateX(calc(-1 * var(--position-x-level-3)))
    translateY(var(--active-position-y));
  z-index: 20;
}
.card:nth-child(5).not-active {
  transform: scale(calc(var(--scale-level-3) - var(--not-active-scale-offset)))
    rotate(var(--rotate-level-3))
    translateX(calc(-1 * var(--position-x-level-3)))
    translateY(var(--position-y-level-3));
}

.card.not-active:before {
  opacity: 0.5;
  visibility: visible;
}

.bottom-info {
  width: 100%;
  max-width: 1400px;
  margin-top: 36vw;
  padding: 0 2.5vw;
  box-sizing: border-box;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2vw;
}

.bottom-info .headline {
  margin: 0;
  font-size: 2vw;
  line-height: 1.2;
  font-weight: 700;
  color: #111;
  max-width: 22ch;
}

.bottom-info .side-text {
  text-align: right;
  max-width: 26ch;
}

.bottom-info .side-text p {
  margin: 0 0 0.4vw;
  font-size: 0.75vw;
  line-height: 1.4;
  color: #444;
}

.bottom-info .side-text a {
  font-size: 0.75vw;
  color: #111;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* ===========================================================
   Línea de escaneo — recorre la vitrina de lado a lado; donde
   cruza una tarjeta o los lentes, revela una capa de texto tipo
   código encima de la imagen (todo lo demás queda igual).
   =========================================================== */
.scan-line-canvas {
  position: absolute;
  top: -8vw;
  left: 0;
  width: 100%;
  height: 34vw;
  min-height: 320px;
  pointer-events: none;
  z-index: 40;
}

.hero-socials {
  position: absolute;
  left: 50%;
  top: calc(100% + 5vw);
  transform: translate(-50%, -50%);
  z-index: 35;
  display: flex;
  align-items: center;
  gap: 1vw;
}

.hero-socials a {
  width: 3.2vw;
  height: 3.2vw;
  min-width: 40px;
  min-height: 40px;
  max-width: 54px;
  max-height: 54px;
  border-radius: 50%;
  background-color: #000;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
  transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
}

.hero-socials svg {
  width: 46%;
  height: 46%;
}

.hero-socials a:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
  background-color: #041cff;
}

@media (max-width: 700px) {
  .hero-socials {
    top: calc(100% + 5vw);
    gap: 3vw;
  }
  .hero-socials a {
    width: 9vw;
    height: 9vw;
  }
}

.glasses-wrap {
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translate(-50%, -12%);
  width: 58vw;
  min-width: 340px;
  max-width: 920px;
  z-index: 30;
  filter: drop-shadow(0 1.5vw 1.5vw rgba(0, 0, 0, 0.25));
  pointer-events: none;
}

.glasses-wrap .glasses-img {
  position: relative;
  display: block;
  width: 100%;
  pointer-events: none;
}

/* ===========================================================
   Texto a través del cristal — interior nítido (dentro de los
   aros reales de sc-lent.png) + exterior ondulado/encogido,
   igual que la demo aprobada. El canvas ahora cubre todo el
   ancho de la vitrina (hasta las flechas), no solo la foto;
   el interior se calcula midiendo en vivo dónde cae la foto
   real dentro de ese lienzo más ancho.
   =========================================================== */
.lens-fx {
  position: absolute;
  top: -8vw;
  left: 0;
  width: 100%;
  height: 34vw;
  min-height: 320px;
  pointer-events: none;
  z-index: 32;
}
.lens-fx-source {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

@media (max-width: 700px) {
  .lens-fx { height: 22vw; top: -4vw; }
}


@media (max-width: 700px) {
  .bottom-info {
    flex-direction: column;
    align-items: flex-start;
    gap: 1rem;
  }
  .bottom-info .headline {
    font-size: 6vw;
  }
  .bottom-info .side-text {
    text-align: left;
  }
  .bottom-info .side-text p,
  .bottom-info .side-text a {
    font-size: 3vw;
  }
  .scan-line-canvas { height: 22vw; top: -4vw; }
}
/* =========================================================
   DIRECTORIO — toolbar, filtros y shop grid
   ========================================================= */
@property --dir-angle{ syntax:'<angle>'; inherits:false; initial-value:0deg; }

.reveal-rise{ opacity:0; transform:translateY(22px); transition:opacity .6s var(--ease), transform .6s var(--ease); }
.reveal-rise.is-visible{ opacity:1; transform:translateY(0); }

.dir-section{ width:100%; padding:34vw 40px 0; box-sizing:border-box; }
@media (max-width:720px){ .dir-section{ padding:38vw 18px 0; } }
.dir-wrap{ max-width:1240px; margin:0 auto; font-family:var(--sans); }

/* toolbar */
.dir-toolbar{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:28px; }
.dir-toolbar-side{ flex:1; min-width:0; }
.dir-toolbar-side.right{ display:flex; justify-content:flex-end; }
.dir-toolbar-actions{ display:flex; align-items:center; gap:14px; margin-left:auto; }

/* búsqueda con borde azul animado */
.dir-search{ position:relative; width:100%; max-width:460px; margin:0 auto; border-radius:16px; }
.dir-search-glow{
  position:absolute; inset:0; border-radius:16px;
  background:conic-gradient(from var(--dir-angle), var(--blue-600), var(--blue-300), #ffffff, var(--blue-500), var(--blue-600));
  animation:dirBorderSpin 3.2s linear infinite;
}
@keyframes dirBorderSpin{ to{ --dir-angle:360deg; } }
.dir-search-inner{
  position:relative; z-index:1; margin:2px; display:flex; align-items:center; gap:10px;
  background:var(--white); border-radius:14px; padding:11px 16px;
}
.dir-search-inner svg{ width:17px; height:17px; color:var(--blue-600); flex-shrink:0; }
.dir-search-inner input{
  border:none; outline:none; flex:1; min-width:0; font-family:var(--sans); font-size:13.5px; color:var(--ink); background:none;
}
.dir-search-inner input::placeholder{ color:var(--grey); }

/* ocultar filtros */
.dir-toggle-btn{
  display:flex; align-items:center; gap:9px; padding:10px 16px; border-radius:10px;
  border:1.5px solid var(--ink); background:var(--white); color:var(--ink);
  font-family:var(--sans); font-size:13px; font-weight:600; white-space:nowrap;
  transition:background .25s var(--ease), color .25s var(--ease), transform .2s var(--ease);
}
.dir-toggle-btn svg{ width:16px; height:16px; transition:transform .3s var(--ease); }
.dir-toggle-btn:hover{ background:var(--ink); color:var(--white); transform:translateY(-2px); }
.dir-toggle-btn.is-off svg{ transform:rotate(180deg); }

/* ordenar por */
.dir-sort{ position:relative; }
.dir-sort-btn{
  display:flex; align-items:center; gap:8px; padding:10px 4px; border:none; background:none;
  font-family:var(--sans); font-size:13px; color:var(--ink); white-space:nowrap;
}
.dir-sort-btn strong{ font-weight:700; }
.dir-sort-btn svg{ width:14px; height:14px; transition:transform .3s var(--ease); }
.dir-sort.is-open .dir-sort-btn svg{ transform:rotate(180deg); }
.dir-sort-menu{
  position:absolute; top:calc(100% + 8px); right:0; z-index:20; min-width:220px;
  background:var(--white); border:1px solid var(--line); border-radius:14px; padding:8px;
  box-shadow:0 20px 40px -18px rgba(20,40,120,.28);
  opacity:0; transform:translateY(-8px) scale(.98); pointer-events:none;
  transition:opacity .25s var(--ease), transform .25s var(--ease);
}
.dir-sort.is-open .dir-sort-menu{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.dir-sort-menu button{
  display:block; width:100%; text-align:left; padding:10px 12px; border-radius:9px; border:none; background:none;
  font-family:var(--sans); font-size:13px; color:var(--ink); transition:background .2s var(--ease);
}
.dir-sort-menu button:hover{ background:var(--blue-50); }
.dir-sort-menu button.active{ color:var(--blue-600); font-weight:700; }

/* layout filtros + grid */
.dir-layout{ display:flex; align-items:flex-start; gap:40px; transition:gap .4s var(--ease); }
.dir-layout.filters-hidden{ gap:0; }
.dir-filters{
  width:230px; flex-shrink:0; display:flex; flex-direction:column; gap:26px;
  overflow:hidden; transition:width .4s var(--ease), opacity .3s var(--ease);
}
.dir-layout.filters-hidden .dir-filters{ width:0; opacity:0; }
.dir-filter-group h4{
  font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink); margin-bottom:14px;
}
.dir-check{ display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13.5px; color:var(--grey); cursor:pointer; white-space:nowrap; }
.dir-check input{ width:16px; height:16px; accent-color:var(--blue-600); flex-shrink:0; }
.dir-check:hover{ color:var(--ink); }

.dir-products{ flex:1; min-width:0; }

/* =========================================================
   SHOP GRID (idéntico a index.html)
   ========================================================= */
.shop-grid{
  flex:1; min-width:0;
  display:grid; grid-template-columns:repeat(3, 1fr); gap:34px 26px;
}
@media (max-width:900px){ .shop-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:480px){ .shop-grid{ grid-template-columns:1fr; gap:24px 16px; } }

.shop-card{
  position:relative; background:var(--white); border-radius:26px;
  border:1.5px solid var(--blue-100); padding:14px 14px 16px;
  display:flex; flex-direction:column;
  will-change:transform;
  transition:box-shadow .4s var(--ease), transform .4s var(--ease), border-color .4s var(--ease);
  box-shadow:0 14px 30px -18px rgba(20,40,120,.20);
}
.shop-card:hover{ box-shadow:0 26px 48px -18px rgba(20,40,120,.30); transform:translateY(-4px); border-color:var(--blue-300); }

.shop-top{ display:flex; justify-content:flex-end; gap:8px; margin-bottom:10px; position:relative; z-index:5; }
.shop-icon-btn{
  width:34px; height:34px; border-radius:50%; background:var(--white); border:1px solid var(--blue-100);
  display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0;
  box-shadow:0 4px 10px -2px rgba(20,40,120,.16);
  transition:background .25s var(--ease), color .25s var(--ease), transform .2s var(--ease), border-color .25s var(--ease);
}
.shop-icon-btn svg{ width:15px; height:15px; }
.shop-icon-btn:hover{ background:var(--blue-600); border-color:var(--blue-600); color:var(--white); transform:translateY(-1px); }
.shop-icon-btn.is-active{ background:var(--blue-600); border-color:var(--blue-600); color:var(--white); }

.shop-fav svg{ transition:fill .2s var(--ease), stroke .2s var(--ease); }
.shop-fav.is-active{ background:var(--white); border-color:#ff4d6a; color:#ff4d6a; }
.shop-fav.is-active svg{ fill:#ff4d6a; stroke:#ff4d6a; animation:favPop .45s var(--ease); }
@keyframes favPop{
  0%{ transform:scale(1); }
  30%{ transform:scale(1.4); }
  55%{ transform:scale(0.85); }
  100%{ transform:scale(1); }
}

.shop-share-wrap{ position:relative; }
.shop-share.is-active{ background:var(--blue-600); border-color:var(--blue-600); color:var(--white); animation:sharePop .45s var(--ease); }
@keyframes sharePop{
  0%{ transform:scale(1) rotate(0deg); }
  30%{ transform:scale(1.25) rotate(-14deg); }
  60%{ transform:scale(0.92) rotate(6deg); }
  100%{ transform:scale(1) rotate(0deg); }
}
.shop-share-menu{
  position:absolute; top:calc(100% + 8px); right:0; z-index:10;
  display:flex; gap:6px; background:var(--white); border:1px solid var(--blue-100); border-radius:16px; padding:6px;
  box-shadow:0 14px 28px -12px rgba(20,40,120,.28);
  opacity:0; transform:translateY(-6px) scale(.92); pointer-events:none; transform-origin:top right;
  transition:opacity .22s var(--ease), transform .22s var(--ease);
}
.shop-share-menu.is-open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.shop-share-menu a{
  width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;

  55%{ transform:translateY(0) scale(0.97); }

   ========================================================= */
.header-outer{ position:sticky; top:0; z-index:80; display:flex; justify-content:center; width:100%; padding:18px 24px 0; background:transparent; box-sizing:border-box; }
header{
  width:100%; max-width:1180px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:20px;
  padding:14px 22px; background:rgba(255,255,255,.78); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:999px; box-shadow:0 10px 30px -18px rgba(4,28,255,.16);
  font-family:var(--sans); box-sizing:border-box;
}
@media (max-width:900px){ header{ padding:12px 18px; } }
@media (max-width:720px){ .header-outer{ padding:14px 14px 0; } }
.nav-side{ display:flex; align-items:center; gap:30px; }
.nav-side.nav-right{ justify-content:flex-end; }
.nav-side a{ font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--grey); text-decoration:none; transition:color .2s var(--ease); }
.nav-side a:hover{ color:var(--ink); }
.mark{ display:flex; align-items:center; gap:10px; justify-self:center; text-decoration:none; }
.mark-icon{ width:28px; height:12px; flex-shrink:0; color:var(--blue-600); }
.mark-word{ font-family:var(--serif); font-weight:500; font-size:19px; letter-spacing:-.01em; color:var(--ink); white-space:nowrap; }
.mark-word span{ color:var(--blue-600); }
header nav{ display:flex; gap:30px; }
header nav a{ font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--grey); position:relative; padding-bottom:2px; transition:color .2s var(--ease); text-decoration:none; }
header nav a::after{ content:''; position:absolute; left:0; bottom:-2px; height:1.5px; width:0; background:var(--blue-600); transition:width .3s var(--ease); }
header nav a:hover, header nav a.active{ color:var(--ink); }
header nav a.active::after, header nav a:hover::after{ width:100%; }
.head-actions{ display:flex; align-items:center; gap:10px; }
.head-icon-btn{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); color:var(--ink); text-decoration:none; transition:background .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease), transform .2s var(--ease); }
.head-icon-btn svg{ width:17px; height:17px; }
.head-icon-btn:hover{ background:var(--blue-600); border-color:var(--blue-600); color:var(--white); transform:translateY(-2px); }
.head-icon-btn:active{ transform:translateY(0) scale(0.94); }
.head-auth{ display:flex; align-items:center; gap:14px; margin-right:2px; }
.head-auth-login{
  font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap;
  transition:color .2s var(--ease);
}
.head-auth-login:hover{ color:var(--blue-600); }
.head-auth-register{
  padding:9px 20px; font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  background:var(--blue-600); color:var(--white); border-radius:100px; white-space:nowrap;
  transition:background .25s var(--ease), transform .2s var(--ease);
}
.head-auth-register:hover{ background:var(--blue-700); transform:translateY(-2px); }
@media (max-width:900px){ .head-auth{ display:none; } }

.hamburger{ display:none; flex-direction:column; gap:5px; width:24px; }
.hamburger span{ height:1.6px; width:100%; background:var(--ink); transition:.3s var(--ease); }
.hamburger.active span:nth-child(1){ transform:translateY(6.6px) rotate(45deg); }
.hamburger.active span:nth-child(2){ opacity:0; }
.hamburger.active span:nth-child(3){ transform:translateY(-6.6px) rotate(-45deg); }
#mainNav{ display:none; }
@media (max-width:900px){
  header{ grid-template-columns:auto 1fr auto; }

  .nav-side.nav-right nav{ display:none; }
  #mainNav{
    display:flex; position:fixed; inset:88px 14px auto 14px; z-index:70; background:var(--white);
    border:1px solid var(--line); border-radius:20px; flex-direction:column; align-items:flex-start; gap:0;
    padding:10px 22px 18px; transform:translateY(-8px); opacity:0; pointer-events:none;
    box-shadow:0 20px 40px -20px rgba(4,28,255,.2); transition:opacity .25s var(--ease), transform .25s var(--ease);
  }
  #mainNav.nav-open{ opacity:1; pointer-events:auto; transform:translateY(0); }
  #mainNav a{ width:100%; padding:16px 0; border-bottom:1px solid var(--line); font-size:15px; text-decoration:none; }
  .hamburger{ display:flex; }

.whatsapp-float{
  position:fixed; right:26px; bottom:26px; z-index:150;
  width:60px; height:60px; border-radius:50%;
  background:#25D366; color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 16px 32px -12px rgba(37,211,102,.55);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease);

.whatsapp-float:hover{ transform:translateY(-4px) scale(1.06); box-shadow:0 20px 38px -12px rgba(37,211,102,.7); }
.whatsapp-float:active{ transform:translateY(-1px) scale(0.97); }
.whatsapp-float svg{ width:29px; height:29px; position:relative; z-index:2; }
.whatsapp-float-ring{
  position:absolute; inset:0; border-radius:50%;
  background:#25D366;
  animation:whatsappPulse 2.2s ease-out infinite;
}
.whatsapp-float-ring.delay{ animation-delay:1.1s; }
@keyframes whatsappPulse{
  0%{ transform:scale(1); opacity:.55; }
  100%{ transform:scale(2.1); opacity:0; }
}
.whatsapp-float-tip{
  position:absolute; right:72px; top:50%; transform:translateY(-50%) translateX(6px);
  background:var(--ink); color:#fff; font-size:12.5px; font-weight:600; white-space:nowrap;

}
.whatsapp-float:hover .whatsapp-float-tip{ opacity:1; transform:translateY(-50%) translateX(0); }
@media (max-width:720px){
  .whatsapp-float{ right:16px; bottom:16px; width:54px; height:54px; }
  .whatsapp-float-tip{ display:none; }
}
@media (prefers-reduced-motion: reduce){ .whatsapp-float-ring{ animation:none; opacity:0; } }

function shopBezier(x1, y1, x2, y2, epsilon){
  const curveX = (t) => { const v = 1 - t; return 3*v*v*t*x1 + 3*v*t*t*x2 + t*t*t; };
  const curveY = (t) => { const v = 1 - t; return 3*v*v*t*y1 + 3*v*t*t*y2 + t*t*t; };
  const derivativeCurveX = (t) => { const v = 1 - t; return 3*(2*(t-1)*t + v*v)*x1 + 3*(-t*t*t + 2*v*t)*x2; };
  return function(t){
    let x = t, t0, t1, t2 = x, x2v, d2, i;
    for(i = 0; i < 8; i++){
      x2v = curveX(t2) - x;
      if(Math.abs(x2v) < epsilon) return curveY(t2);
      d2 = derivativeCurveX(t2);
      if(Math.abs(d2) < 1e-6) break;
      t2 = t2 - x2v / d2;
    }
    t0 = 0; t1 = 1; t2 = x;
    if(t2 < t0) return curveY(t0);
    if(t2 > t1) return curveY(t1);
    while(t0 < t1){
      x2v = curveX(t2);
      if(Math.abs(x2v - x) < epsilon) return curveY(t2);
      if(x > x2v) t0 = t2; else t1 = t2;
      t2 = (t1 - t0) * 0.5 + t0;
    }
    return curveY(t2);
  };
}

class ScanBar {
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particles = [];
    this.count = 0;
    this.maxParticles = opts.maxParticles ?? 500;
    this.lightBarWidth = opts.lightBarWidth ?? 3;
    this.fadeZone = opts.fadeZone ?? 40;
    this.lightBarX = 0;
    this.resize();
    this.createGradientCache();
    for (let i = 0; i < this.maxParticles; i++) this.spawnParticle();
    window.addEventListener('resize', () => this.resize());
  }
  resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.w = Math.max(1, rect.width);
    this.h = Math.max(1, rect.height);
    this.canvas.width = this.w;
    this.canvas.height = this.h;
  }
  createGradientCache() {
    this.gradientCanvas = document.createElement('canvas');
    this.gradientCanvas.width = 24;
    this.gradientCanvas.height = 24;
    const gctx = this.gradientCanvas.getContext('2d');
    const half = 12;
    const gradient = gctx.createRadialGradient(half, half, 0, half, half, half);
    gradient.addColorStop(0, 'rgba(4, 28, 255, 1)');
    gradient.addColorStop(0.4, 'rgba(62, 90, 255, 0.9)');
    gradient.addColorStop(0.75, 'rgba(137, 146, 255, 0.6)');
    gradient.addColorStop(1, 'transparent');
    gctx.fillStyle = gradient;
    gctx.beginPath();
    gctx.arc(half, half, half, 0, Math.PI * 2);
    gctx.fill();
  }
  randomFloat(min, max) { return Math.random() * (max - min) + min; }
  spawnParticle() {
    this.count++;
    this.particles[this.count] = {
      x: this.lightBarX + this.randomFloat(-this.lightBarWidth / 2, this.lightBarWidth / 2),
      y: this.randomFloat(0, this.h),
      vx: this.randomFloat(0.3, 1.4),
      vy: this.randomFloat(-0.2, 0.2),
      radius: this.randomFloat(1.2, 2.6),
      alpha: this.randomFloat(0.75, 1),
      life: 1,
      decay: this.randomFloat(0.006, 0.02),
      twinkleSpeed: this.randomFloat(0.02, 0.08),
      twinkleAmount: this.randomFloat(0.1, 0.25),
      time: 0,
    };
  }
  updateParticle(p) {
    p.x += p.vx;
    p.y += p.vy;
    p.time++;
    p.alpha = Math.max(0, p.life) + Math.sin(p.time * p.twinkleSpeed) * p.twinkleAmount;
    p.life -= p.decay;
    if (p.x > this.w + 10 || p.life <= 0) {
      p.x = this.lightBarX + this.randomFloat(-this.lightBarWidth / 2, this.lightBarWidth / 2);
      p.y = this.randomFloat(0, this.h);
      p.life = 1;
      p.time = 0;
    }
  }
  drawParticle(p) {
    let fadeAlpha = 1;
    if (p.y < this.fadeZone) fadeAlpha = p.y / this.fadeZone;
    else if (p.y > this.h - this.fadeZone) fadeAlpha = (this.h - p.y) / this.fadeZone;
    fadeAlpha = Math.max(0, Math.min(1, fadeAlpha));
    this.ctx.globalAlpha = Math.max(0, p.alpha) * fadeAlpha;
    this.ctx.drawImage(this.gradientCanvas, p.x - p.radius, p.y - p.radius, p.radius * 2, p.radius * 2);
  }
  drawLightBar() {
    const ctx = this.ctx;
    const verticalGradient = ctx.createLinearGradient(0, 0, 0, this.h);
    verticalGradient.addColorStop(0, 'rgba(255,255,255,0)');
    verticalGradient.addColorStop(this.fadeZone / this.h, 'rgba(255,255,255,1)');
    verticalGradient.addColorStop(1 - this.fadeZone / this.h, 'rgba(255,255,255,1)');
    verticalGradient.addColorStop(1, 'rgba(255,255,255,0)');

    ctx.globalCompositeOperation = 'lighter';
    const lw = this.lightBarWidth;

    const core = ctx.createLinearGradient(this.lightBarX - lw / 2, 0, this.lightBarX + lw / 2, 0);
    core.addColorStop(0, 'rgba(255,255,255,0)');
    core.addColorStop(0.3, 'rgba(255,255,255,0.9)');
    core.addColorStop(0.5, 'rgba(255,255,255,1)');
    core.addColorStop(0.7, 'rgba(255,255,255,0.9)');
    core.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.roundRect(this.lightBarX - lw / 2, 0, lw, this.h, 15);
    ctx.fill();

    const glow1 = ctx.createLinearGradient(this.lightBarX - lw * 2, 0, this.lightBarX + lw * 2, 0);
    glow1.addColorStop(0, 'rgba(137,146,255,0)');
    glow1.addColorStop(0.5, 'rgba(137,146,255,0.8)');
    glow1.addColorStop(1, 'rgba(137,146,255,0)');
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = glow1;
    ctx.beginPath();
    ctx.roundRect(this.lightBarX - lw * 2, 0, lw * 4, this.h, 25);
    ctx.fill();

    const glow2 = ctx.createLinearGradient(this.lightBarX - lw * 4, 0, this.lightBarX + lw * 4, 0);
    glow2.addColorStop(0, 'rgba(4,28,255,0)');
    glow2.addColorStop(0.5, 'rgba(4,28,255,0.45)');
    glow2.addColorStop(1, 'rgba(4,28,255,0)');
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = glow2;
    ctx.beginPath();
    ctx.roundRect(this.lightBarX - lw * 4, 0, lw * 8, this.h, 35);
    ctx.fill();

    ctx.globalCompositeOperation = 'destination-in';
    ctx.globalAlpha = 1;
    ctx.fillStyle = verticalGradient;
    ctx.fillRect(0, 0, this.w, this.h);
  }
  render(lightBarX) {
    this.lightBarX = lightBarX;
    const ctx = this.ctx;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, this.w, this.h);
    this.drawLightBar();

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i <= this.count; i++) {
      const p = this.particles[i];
      if (p) {
        this.updateParticle(p);
        this.drawParticle(p);
      }
    }
  }
  clear() {
    this.ctx.globalCompositeOperation = 'source-over';
    this.ctx.clearRect(0, 0, this.w, this.h);
  }
}

    const t0 = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / total);
      scanBar.render(startX + (endX - startX) * t);
      if(t < 1){
        scanFrame = requestAnimationFrame(tick);
      } else {
        scanBar.clear();
        scanFrame = null;
      }
    };
    scanFrame = requestAnimationFrame(tick);
  };

  let current = 0;
  let timer = null;
  let animating = false;

  const step = (dir) => {
    if(animating) return;
    animating = true;
    const next = (current + dir + paths.length) % paths.length;
    const curPath = paths[current];
    const nextPath = paths[next];
    const nextImage = svgImages[next];
    const hidden = dir === 1 ? SHOP_CLIP.HIDDEN_R : SHOP_CLIP.HIDDEN_L;
    const mid = dir === 1 ? SHOP_CLIP.MID_R : SHOP_CLIP.MID_L;

    svgEl.appendChild(nextImage);

    dots[current] && dots[current].classList.remove('active');
    dots[next] && dots[next].classList.add('active');
    runScan(dir);

    if(useSnap){
      const snapPath = Snap(nextPath);
      snapPath.attr({ d: hidden });
      snapPath.animate({ d: mid }, SHOP_WIPE_DURATION, shopEase1, () => {
        snapPath.animate({ d: SHOP_CLIP.FULL }, SHOP_WIPE_DURATION, shopEase2, () => {
          Snap(curPath).attr({ d: hidden });
          current = next;
          animating = false;
        });
      });
    } else {
      nextPath.style.transition = 'none';
      nextPath.setAttribute('d', hidden);
      void nextPath.getBoundingClientRect();
      nextPath.style.transition = `d ${SHOP_WIPE_DURATION*2}ms ease`;
      nextPath.setAttribute('d', SHOP_CLIP.FULL);
      setTimeout(() => {
        curPath.style.transition = 'none';
        curPath.setAttribute('d', hidden);
        current = next;
        animating = false;
      }, SHOP_WIPE_DURATION*2 + 40);
    }
  };

  const start = () => {
    if(timer) return;
    timer = setInterval(() => step(1), SHOP_WIPE_DURATION*2 + SHOP_HOLD_MS);
  };
  const stop = () => {
    clearInterval(timer);
    timer = null;
  };
  const restart = () => { stop(); start(); };

  photo.addEventListener('mouseenter', start);
  photo.addEventListener('mouseleave', stop);
  photo.addEventListener('touchstart', start, {passive:true});

  if(nextBtn) nextBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); step(1); restart(); });
  if(prevBtn) prevBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); step(-1); restart(); });

  const favBtn = card.querySelector('.shop-fav');
  if(favBtn) favBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const active = favBtn.classList.toggle('is-active');
    favBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });

  const shareBtn = card.querySelector('.shop-share');
  const shareMenu = card.querySelector('.shop-share-menu');
  if(shareBtn) shareBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    shareBtn.classList.remove('is-active');
    void shareBtn.offsetWidth;
    shareBtn.classList.add('is-active');
    setTimeout(() => shareBtn.classList.remove('is-active'), 450);
    if(shareMenu){
      document.querySelectorAll('.shop-share-menu.is-open').forEach(m => { if(m !== shareMenu) m.classList.remove('is-open'); });
      shareMenu.classList.toggle('is-open');
    }
  });
  if(shareMenu) shareMenu.addEventListener('click', (e) => {
    e.stopPropagation();
    if(e.target.closest('a')) shareMenu.classList.remove('is-open');
  });

  const sizeSelect = card.querySelector('.shop-size-select');
  if(sizeSelect) sizeSelect.addEventListener('click', (e) => {
    e.stopPropagation();
    window.location.href = `detalle-producto.html?id=${cardIndex}`;
  });

  const rulerBtn = card.querySelector('.shop-ruler-btn');
  if(rulerBtn) rulerBtn.addEventListener('click', (e) => e.stopPropagation());

  const buyBtn = card.querySelector('.shop-buy');
  if(buyBtn) buyBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    buyBtn.classList.add('is-added');
    const label = buyBtn.querySelector('span');
    const original = label.textContent;
    label.textContent = 'Agregado';
    setTimeout(() => { buyBtn.classList.remove('is-added'); label.textContent = original; }, 1400);
  });

  card.style.cursor = 'pointer';
  card.addEventListener('click', () => {
    window.location.href = `detalle-producto.html?id=${cardIndex}`;
  });
});

document.addEventListener('click', () => {
  document.querySelectorAll('.shop-share-menu.is-open').forEach(m => m.classList.remove('is-open'));
});

/* reveal al hacer scroll */
if('IntersectionObserver' in window){
  const shopReveal = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        shopReveal.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  shopGrid.querySelectorAll('.reveal-rise').forEach(el => shopReveal.observe(el));
} else {
  shopGrid.querySelectorAll('.reveal-rise').forEach(el => el.classList.add('is-visible'));
}
</script>

<script>
/* ===========================================================
   TEXTO A TRAVÉS DEL CRISTAL — dos texturas, cada una ya
   rasterizada a su tamaño final en pantalla (nítida y grande
   dentro del cristal, chica y ondulada afuera). Así el tamaño
   nunca depende de una división de zoom que se pueda
   desajustar al ensanchar el lienzo — lo que se rasteriza es
   exactamente lo que se ve. El canvas cubre todo el ancho de
   la vitrina (hasta las flechas); la posición de los aros se
   mide en vivo contra la foto real.
   =========================================================== */
(function () {
  'use strict';

  const stage  = document.querySelector('.cards-wrapper');
  const wrap   = document.querySelector('.glasses-wrap');
  const img    = wrap.querySelector('.glasses-img');
  const canvas = document.getElementById('lensFx');
  const source = document.getElementById('lensFxSource');
  const TEXT   = source.textContent.trim();

  const CFG = {
    // tamaños de letra como fracción del ANCHO DE LA FOTO (no del
    // lienzo completo) — así "mismo tamaño" significa relativo a
    // los lentes, igual que en la demo.
    interiorFont: 0.050,
    exteriorFont: 0.022,
    gapEm: 3.0,        // separación entre repeticiones, en "ees" de cada tamaño
    speed: 22,         // px/s en pantalla, mismo ritmo para ambas zonas
    feather: 0.0042,   // suavizado del borde, fracción del ancho de la foto
    warp: 1.0,
    blur: 0.0,
    compress: 0.0,     // pequeño ajuste de escala cerca del borde (interior)
    aberr: 0.014,      // aberración cromática cerca del borde (interior)
    ink: '#141414',
    weight: 400,       // peso de la tipografía (400 normal, 600 semi, 700 negrita — son los únicos cargados)
    lenses: [
      // izquierdo: rxL = lado del ojo (afuera, achicado a propósito), rxR = lado del puente (adentro, al aro real)
      { cx: 0.244, cy: 0.445, ry: 0.190, rxL: 0.125, rxR: 0.190 },
      // derecho: rxL = lado del puente (adentro, al aro real), rxR = lado del ojo (afuera, achicado a propósito)
      { cx: 0.753, cy: 0.445, ry: 0.190, rxL: 0.190, rxR: 0.125 }
    ]
  };

  const DEBUG = location.hash === '#calibrar-lentes';

  const gl = canvas.getContext('webgl2', {
    alpha: true, premultipliedAlpha: true, antialias: false, powerPreference: 'high-performance'
  });
  if (!gl) return;

  const VS = `#version 300 es
  void main(){
    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const FS = `#version 300 es
  precision highp float;
  uniform vec2  uRes;
  uniform vec2  uTexIn;
  uniform vec2  uTexOut;
  uniform float uScroll;
  uniform float uTime;
  uniform float uDpr;
  uniform vec2  uAnchor;
  uniform vec4  uL0;
  uniform vec4  uL1;
  uniform vec2  uRxR;   // radio hacia el puente (lente 0, lente 1)
  uniform float uFeather;
  uniform float uBlur;
  uniform float uWarp;
  uniform float uAberr;
  uniform float uCompress;
  uniform float uDebug;
  uniform vec3  uInk;
  uniform sampler2D uTxIn;
  uniform sampler2D uTxOut;
  out vec4 fragColor;

  const vec2 TAPS[8] = vec2[8](
    vec2(0.0,0.0), vec2(1.0,0.0), vec2(-1.0,0.0), vec2(0.0,1.0),
    vec2(0.0,-1.0), vec2(0.72,0.72), vec2(-0.72,0.72), vec2(0.72,-0.72)
  );

  vec2 sampleAt(vec2 p, vec2 texSize, float zoom, float scroll){
    vec2 q = (p - uAnchor) / zoom;
    return vec2(q.x + scroll, q.y + texSize.y * 0.5);
  }
  float covIn(vec2 w){ return texture(uTxIn, w / uTexIn).a; }
  float covOut(vec2 w){ return texture(uTxOut, w / uTexOut).a; }

  float mask(vec2 p, vec4 L, float rxR, out float d){
    float rx = (p.x < L.x) ? L.w : rxR;   // L.w trae rxL (lado izq. de pantalla), rxR el derecho
    vec2 n = vec2((p.x - L.x) / rx, (p.y - L.y) / L.z);
    d = length(n);
    float fw = max(uFeather / max(rx, 1.0), 0.0015);
    return 1.0 - smoothstep(1.0 - fw, 1.0, d);
  }

  void main(){
    vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);

    float d0, d1;
    float m = max(mask(p, uL0, uRxR.x, d0), mask(p, uL1, uRxR.y, d1));
    float dmin = min(d0, d1);
    float far = smoothstep(1.0, 2.5, dmin);

    /* ---------- EXTERIOR: ya rasterizado chico, solo se ondula ---------- */
    vec2 pd = p;
    float w = uWarp * (1.0 - m) * (0.35 + 0.65 * far);
    if(w > 0.0){
      float x = p.x / uDpr, y = p.y / uDpr;
      pd.y += (sin(x * 0.017 + uTime * 0.9) * 3.4 + sin(x * 0.041 - uTime * 1.4) * 1.5) * w * uDpr;
      pd.x += (cos(y * 0.030 + uTime * 0.6) * 2.6) * w * uDpr;
    }
    vec2 wOut = sampleAt(pd, uTexOut, 1.0, uScroll);
    float r = uBlur * uDpr * (0.45 + 0.85 * far);
    float acc = 0.0, sum = 0.0;
    for(int i = 0; i < 8; i++){
      float wt = (i == 0) ? 1.7 : 1.0;
      acc += covOut(wOut + TAPS[i] * r) * wt;
      sum += wt;
    }
    float outCov = acc / sum;

    /* ---------- INTERIOR: ya rasterizado grande y nítido ---------- */
    float edge = smoothstep(0.42, 1.02, dmin);
    vec3 inCov;
    for(int c = 0; c < 3; c++){
      float zEff = (1.0 + uCompress * edge * edge) * (1.0 + uAberr * edge * (float(c) - 1.0));
      vec2 wIn = sampleAt(p, uTexIn, zEff, uScroll);
      inCov[c] = covIn(wIn);
    }

    vec3 c3 = mix(vec3(outCov), inCov, m);
    float a  = max(max(c3.r, c3.g), c3.b);
    vec3 rgb = uInk * c3;   // premultiplicado: sin fondo, solo la letra

    if(uDebug > 0.5){
      float ring = min(abs(d0 - 1.0), abs(d1 - 1.0));
      float ringA = uDebug * (1.0 - smoothstep(0.0, 0.006, ring));
      a   = max(a, ringA);
      rgb = max(rgb, vec3(1.0, 0.0, 0.2) * ringA);
    }

    if(a <= 0.001){ discard; }
    fragColor = vec4(rgb, a);
  }`;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindVertexArray(gl.createVertexArray());

  const U = {};
  ['uRes','uTexIn','uTexOut','uScroll','uTime','uDpr','uAnchor','uL0','uL1','uRxR','uFeather',
   'uBlur','uWarp','uAberr','uCompress','uDebug','uInk','uTxIn','uTxOut']
    .forEach(n => { U[n] = gl.getUniformLocation(prog, n); });

  function makeTexture(unit){
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    const anisoExt = gl.getExtension('EXT_texture_filter_anisotropic');
    if(anisoExt){
      const max = gl.getParameter(anisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
      gl.texParameterf(gl.TEXTURE_2D, anisoExt.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, max));
    }
    return tex;
  }
  const texIn  = makeTexture(0);
  const texOut = makeTexture(1);
  gl.uniform1i(U.uTxIn, 0);
  gl.uniform1i(U.uTxOut, 1);

  const MAXTEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  const hex = h => [1,3,5].map(i => parseInt(h.substr(i,2),16)/255);

  const pad  = document.createElement('canvas');
  const pctx = pad.getContext('2d');

  // Rasteriza el texto a `fontPx` (altura de letra en px de buffer)
  // y lo sube a la unidad de textura `unit`. Devuelve {w,h}.
  function rasterize(tex, unit, fontPx, gapEm){
    fontPx = Math.max(6, Math.min(fontPx, MAXTEX / 8));
    pctx.font = `${CFG.weight} ${fontPx}px "Ruda", system-ui, sans-serif`;
    const gapPx = fontPx * gapEm;
    let w = Math.ceil(pctx.measureText(TEXT).width + gapPx);
    let h = Math.ceil(fontPx * 1.75);
    w = Math.min(w, MAXTEX);
    h = Math.min(h, MAXTEX);

    pad.width = w; pad.height = h;
    pctx.clearRect(0, 0, w, h);
    pctx.font = `${CFG.weight} ${fontPx}px "Ruda", system-ui, sans-serif`;
    pctx.textBaseline = 'middle';
    pctx.textAlign = 'left';
    pctx.fillStyle = '#000';
    pctx.fillText(TEXT, 0, h / 2);

    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pad);
    gl.generateMipmap(gl.TEXTURE_2D);
    return { w, h };
  }

  let texInSize = { w: 1, h: 1 }, texOutSize = { w: 1, h: 1 };
  let ready = false;
  let dpr = 1;

  function build(){
    const canvasRect = canvas.getBoundingClientRect();
    const imgRect = img.getBoundingClientRect();
    if(!canvasRect.width || !imgRect.width) return;

    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(canvasRect.width * dpr);
    canvas.height = Math.round(canvasRect.height * dpr);

    // Tamaños de letra en px de buffer, como fracción del ANCHO DE
    // LA FOTO (no del lienzo ancho) — así el texto queda del mismo
    // tamaño relativo a los lentes sin importar cuánto más grande
    // sea el lienzo que lo contiene.
    const fontInPx  = CFG.interiorFont * imgRect.width * dpr;
    const fontOutPx = CFG.exteriorFont * imgRect.width * dpr;
    texInSize  = rasterize(texIn,  0, fontInPx,  CFG.gapEm);
    texOutSize = rasterize(texOut, 1, fontOutPx, CFG.gapEm);

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform2f(U.uTexIn, texInSize.w, texInSize.h);
    gl.uniform2f(U.uTexOut, texOutSize.w, texOutSize.h);
    gl.uniform1f(U.uDpr, dpr);
    gl.uniform3f(U.uInk, ...hex(CFG.ink));

    // Posición de los aros: medida en vivo contra la foto real,
    // convertida a coordenadas del lienzo ancho (buffer px).
    const offX = (imgRect.left - canvasRect.left) * dpr;
    const offY = (imgRect.top  - canvasRect.top)  * dpr;
    const [L, R] = CFG.lenses;
    const lensPx = (Lx) => [
      offX + Lx.cx * imgRect.width * dpr,
      offY + Lx.cy * imgRect.height * dpr,
      Lx.ry * imgRect.height * dpr,
      Lx.rxL * imgRect.width * dpr
    ];
    const l0 = lensPx(L), l1 = lensPx(R);
    gl.uniform4f(U.uL0, ...l0);
    gl.uniform4f(U.uL1, ...l1);
    gl.uniform2f(U.uRxR, L.rxR * imgRect.width * dpr, R.rxR * imgRect.width * dpr);
    gl.uniform2f(U.uAnchor, canvas.width / 2, l0[1]);
    gl.uniform1f(U.uFeather, CFG.feather * imgRect.width * dpr);
    gl.uniform1f(U.uBlur, CFG.blur * dpr);
    gl.uniform1f(U.uWarp, CFG.warp);
    gl.uniform1f(U.uAberr, CFG.aberr);
    gl.uniform1f(U.uCompress, CFG.compress);
    gl.uniform1f(U.uDebug, DEBUG ? 1 : 0);
    ready = true;
  }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let scroll = 0, last = performance.now(), t = 0;

  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if(!reduced){
      t += dt;
      scroll = (scroll + CFG.speed * dpr * dt);
      if(texInSize.w > 1)  scroll = scroll % texInSize.w;
    }
    if(ready){
      gl.uniform1f(U.uScroll, scroll);
      gl.uniform1f(U.uTime, t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(frame);
  }

  new ResizeObserver(build).observe(stage);
  function start(){
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
      build();
      requestAnimationFrame(frame);
    });
  }
  if(img.complete && img.naturalWidth) start();
  else img.addEventListener('load', start, { once: true });
})();
</script>

<script>
const cards = document.querySelectorAll(".card");
cards.forEach((card) => {
  card.addEventListener("mouseenter", () => {
    cards.forEach((c) => {
      if (c == card) c.classList.add("active");
      else c.classList.add("not-active");
    });
  });
  card.addEventListener("mouseleave", () => {
    cards.forEach((c) => {
      c.classList.remove("active", "not-active");
    });
  });
});

/* ===========================================================
   Línea de escaneo — se mueve sola de izquierda a derecha (y de
   regreso) sobre las cards y los lentes. La barra se dibuja en
   canvas replicando exactamente el efecto del repo (capas de
   degradado + partículas). Donde la línea cruza una card o los
   lentes, esa franja revela partículas azules sobre negro en
   vez de la imagen (en vez del texto de código de antes).
   =========================================================== */
(function () {
  const wrapper = document.querySelector(".cards-wrapper");
  const targets = [...document.querySelectorAll(".card"), document.querySelector(".glasses-wrap"), document.querySelector(".hero-socials")];

  let x = 0;
  let direction = 1;
  const speed = 260; // px/s
  let lastTime = 0;

  /* ---------- Desvanecido a blanco donde ya pasó la raya ---------- */
  function updateReveal() {
    const wrapperRect = wrapper.getBoundingClientRect();
    const lineX = wrapperRect.left + x;

    targets.forEach((el) => {
      if (!el) return;
      const rect = el.getBoundingClientRect();
      if (rect.width === 0) return;

      if (rect.right < lineX) {
        el.style.clipPath = "inset(0 100% 0 0)"; // ya pasó: desaparece
      } else if (rect.left > lineX) {
        el.style.clipPath = "inset(0 0 0 0)"; // aún no llega: visible normal
      } else {
        const pct = ((lineX - rect.left) / rect.width) * 100;
        el.style.clipPath = `inset(0 0 0 ${pct}%)`;
      }
    });
  }

  /* ---------- Barra de escaneo (canvas) — replica del repo original ---------- */
  class ScanBar {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext("2d");
      this.particles = [];
      this.count = 0;
      this.maxParticles = 500;
      this.lightBarWidth = 3;
      this.fadeZone = 40;
      this.resize();
      this.createGradientCache();
      for (let i = 0; i < this.maxParticles; i++) this.spawnParticle();
      window.addEventListener("resize", () => this.resize());
    }
    resize() {
      const rect = this.canvas.getBoundingClientRect();
      this.w = Math.max(1, rect.width);
      this.h = Math.max(1, rect.height);
      this.canvas.width = this.w;
      this.canvas.height = this.h;
    }
    createGradientCache() {
      this.gradientCanvas = document.createElement("canvas");
      this.gradientCanvas.width = 24;
      this.gradientCanvas.height = 24;
      const gctx = this.gradientCanvas.getContext("2d");
      const half = 12;
      const gradient = gctx.createRadialGradient(half, half, 0, half, half, half);
      gradient.addColorStop(0, "rgba(4, 28, 255, 1)");
      gradient.addColorStop(0.4, "rgba(62, 90, 255, 0.9)");
      gradient.addColorStop(0.75, "rgba(139, 92, 246, 0.6)");
      gradient.addColorStop(1, "transparent");
      gctx.fillStyle = gradient;
      gctx.beginPath();
      gctx.arc(half, half, half, 0, Math.PI * 2);
      gctx.fill();
    }
    randomFloat(min, max) {
      return Math.random() * (max - min) + min;
    }
    spawnParticle() {
      this.count++;
      this.particles[this.count] = {
        x: this.lightBarX + this.randomFloat(-this.lightBarWidth / 2, this.lightBarWidth / 2),
        y: this.randomFloat(0, this.h),
        vx: this.randomFloat(0.3, 1.4),
        vy: this.randomFloat(-0.2, 0.2),
        radius: this.randomFloat(1.4, 3.2),
        alpha: this.randomFloat(0.75, 1),
        life: 1,
        decay: this.randomFloat(0.006, 0.02),
        twinkleSpeed: this.randomFloat(0.02, 0.08),
        twinkleAmount: this.randomFloat(0.1, 0.25),
        time: 0,
      };
    }
    updateParticle(p) {
      p.x += p.vx;
      p.y += p.vy;
      p.time++;
      p.alpha = Math.max(0, p.life) + Math.sin(p.time * p.twinkleSpeed) * p.twinkleAmount;
      p.life -= p.decay;
      if (p.x > this.w + 10 || p.life <= 0) {
        p.x = this.lightBarX + this.randomFloat(-this.lightBarWidth / 2, this.lightBarWidth / 2);
        p.y = this.randomFloat(0, this.h);
        p.life = 1;
        p.time = 0;
      }
    }
    drawParticle(p) {
      let fadeAlpha = 1;
      if (p.y < this.fadeZone) fadeAlpha = p.y / this.fadeZone;
      else if (p.y > this.h - this.fadeZone) fadeAlpha = (this.h - p.y) / this.fadeZone;
      fadeAlpha = Math.max(0, Math.min(1, fadeAlpha));
      this.ctx.globalAlpha = Math.max(0, p.alpha) * fadeAlpha;
      this.ctx.drawImage(this.gradientCanvas, p.x - p.radius, p.y - p.radius, p.radius * 2, p.radius * 2);
    }
    drawLightBar() {
      const ctx = this.ctx;
      const verticalGradient = ctx.createLinearGradient(0, 0, 0, this.h);
      verticalGradient.addColorStop(0, "rgba(255,255,255,0)");
      verticalGradient.addColorStop(this.fadeZone / this.h, "rgba(255,255,255,1)");
      verticalGradient.addColorStop(1 - this.fadeZone / this.h, "rgba(255,255,255,1)");
      verticalGradient.addColorStop(1, "rgba(255,255,255,0)");

      ctx.globalCompositeOperation = "lighter";
      const lw = this.lightBarWidth;

      const core = ctx.createLinearGradient(this.lightBarX - lw / 2, 0, this.lightBarX + lw / 2, 0);
      core.addColorStop(0, "rgba(255,255,255,0)");
      core.addColorStop(0.3, "rgba(255,255,255,0.9)");
      core.addColorStop(0.5, "rgba(255,255,255,1)");
      core.addColorStop(0.7, "rgba(255,255,255,0.9)");
      core.addColorStop(1, "rgba(255,255,255,0)");
      ctx.globalAlpha = 1;
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.roundRect(this.lightBarX - lw / 2, 0, lw, this.h, 15);
      ctx.fill();

      const glow1 = ctx.createLinearGradient(this.lightBarX - lw * 2, 0, this.lightBarX + lw * 2, 0);
      glow1.addColorStop(0, "rgba(139,92,246,0)");
      glow1.addColorStop(0.5, "rgba(196,181,253,0.8)");
      glow1.addColorStop(1, "rgba(139,92,246,0)");
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = glow1;
      ctx.beginPath();
      ctx.roundRect(this.lightBarX - lw * 2, 0, lw * 4, this.h, 25);
      ctx.fill();

      const glow2 = ctx.createLinearGradient(this.lightBarX - lw * 4, 0, this.lightBarX + lw * 4, 0);
      glow2.addColorStop(0, "rgba(4,28,255,0)");
      glow2.addColorStop(0.5, "rgba(4,28,255,0.45)");
      glow2.addColorStop(1, "rgba(4,28,255,0)");
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = glow2;
      ctx.beginPath();
      ctx.roundRect(this.lightBarX - lw * 4, 0, lw * 8, this.h, 35);
      ctx.fill();

      ctx.globalCompositeOperation = "destination-in";
      ctx.globalAlpha = 1;
      ctx.fillStyle = verticalGradient;
      ctx.fillRect(0, 0, this.w, this.h);
    }
    render(lightBarX) {
      this.lightBarX = lightBarX;
      const ctx = this.ctx;
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, this.w, this.h);
      this.drawLightBar();

      ctx.globalCompositeOperation = "lighter";
      for (let i = 1; i <= this.count; i++) {
        const p = this.particles[i];
        if (p) {
          this.updateParticle(p);
          this.drawParticle(p);
        }
      }
    }
  }

  const scanBar = new ScanBar(document.getElementById("scanLine"));

  let running = false;

  function hideLine() {
    scanBar.ctx.clearRect(0, 0, scanBar.w, scanBar.h);
  }

  function tick(t) {
    if (!lastTime) lastTime = t;
    const dt = (t - lastTime) / 1000;
    lastTime = t;

    if (!running) { lastTime = 0; return; }

    const wrapperWidth = wrapper.getBoundingClientRect().width;
    x += speed * direction * dt;

    if (x >= wrapperWidth) {
      x = wrapperWidth;
      running = false;
      hideLine();
      updateReveal();
      return;
    }
    if (x <= 0) {
      x = 0;
      running = false;
      hideLine();
      updateReveal();
      return;
    }

    scanBar.render(x);
    updateReveal();
    requestAnimationFrame(tick);
  }

  function goDirection(dir) {
    direction = dir;
    if (!running) {
      running = true;
      lastTime = 0;
      requestAnimationFrame(tick);
    }
  }

  window.addEventListener("resize", updateReveal);
})();
