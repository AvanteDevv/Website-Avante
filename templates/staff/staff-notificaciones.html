<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificaciones · Avante Optics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/admin/userbar.css">
<link rel="stylesheet" href="/static/css/admin/sidebar.css">
<link rel="stylesheet" href="/static/css/admin/base-de-datos.css">
<link rel="stylesheet" href="/static/css/staff/notificaciones.css">
</head>
<body class="cuenta-body">

{{template "admin-userbar" .}}

<div class="cuenta-shell">
  {{template "admin-sidebar" .}}

  <main class="cuenta-main" id="avisosPage">
    <div class="cuenta-header admin-header-row">
      <div>
        <h1>Notificaciones</h1>
        <p>Avisos que te manda la administración. Los nuevos te llegan al momento, también en la campanita de arriba.</p>
      </div>
      <button type="button" class="btn thin" id="avisosReadAll" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L7 17l-5-5"/><path d="M22 10l-7.5 7.5L13 16"/></svg>
        Marcar todos como leídos
      </button>
    </div>

    <div class="admin-stats">
      <div class="stat-card-wrap"><div class="stat-card-glow"></div><div class="admin-stat-card"><div class="num" id="avisosStatTotal">0</div><div class="label">Avisos</div></div></div>
      <div class="stat-card-wrap"><div class="stat-card-glow"></div><div class="admin-stat-card"><div class="num" id="avisosStatUnread">0</div><div class="label">Sin leer</div></div></div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Tus avisos</h2>
          <p id="avisosSubtitle">Cargando…</p>
        </div>
        <div class="filter-pills" id="avisosFilters">
          <button type="button" class="filter-pill active" data-filter="todos">Todos</button>
          <button type="button" class="filter-pill" data-filter="no-leidos">Sin leer</button>
        </div>
      </div>
      <div class="avisos-list" id="avisosList"></div>
      <p class="avisos-empty" id="avisosEmpty" hidden></p>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="/static/js/admin/sidebar.js"></script>
<script src="/static/js/admin/userbar.js"></script>
<script defer src="/static/js/staff/notificaciones.js"></script>
</body>
</html>
