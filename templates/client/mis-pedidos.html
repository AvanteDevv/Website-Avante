<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis pedidos — Avante Optics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/client/userbar.css">
<link rel="stylesheet" href="static/css/client/sidebar.css">
<link rel="stylesheet" href="static/css/client/mis-pedidos.css">
</head>
<body class="cuenta-body">

{{template "userbar" .}}

<div class="cuenta-shell">
  {{template "sidebar" .}}

  <main class="cuenta-main">
    <div class="cuenta-header">
      <h1>Mis pedidos</h1>
      <p>Historial y estado de tus compras en Avante Optics.</p>
    </div>

    <div class="cuenta-stats" id="cuentaStats">
      <div class="cuenta-stat-card"><div class="num">0</div><div class="label">Pedidos totales</div></div>
      <div class="cuenta-stat-card"><div class="num">0</div><div class="label">En proceso</div></div>
      <div class="cuenta-stat-card"><div class="num">0</div><div class="label">Entregados</div></div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2>Todos los pedidos</h2>
      </div>
      <div class="panel-body no-pad">
        <div class="order-list" id="orderList"></div>
        <div class="orders-empty" id="ordersEmpty" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <h3>Aún no tienes pedidos</h3>
          <p>Cuando compres algo en la tienda, tu historial va a aparecer aquí.</p>
          <a href="/eccomerce" class="btn small solid">Ir a la tienda</a>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="static/js/client/sidebar.js"></script>
<script src="static/js/client/userbar.js"></script>
<script src="static/js/client/mis-pedidos.js"></script>
</body>
</html>
