<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — Avante Optics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/client/userbar.css">
<link rel="stylesheet" href="static/css/client/sidebar.css">
<link rel="stylesheet" href="static/css/client/mi-perfil.css">
</head>
<body class="cuenta-body">

{{template "userbar" .}}

<div class="cuenta-shell">
  {{template "sidebar" .}}

  <main class="cuenta-main">
    <div class="cuenta-header">
      <h1>Mi perfil</h1>
      <p>Tus datos personales y cómo prefieres que te contactemos.</p>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2>Datos personales</h2>
      </div>
      <div class="panel-body">
        <form>
          <div class="field-grid">
            <div class="field">
              <label for="pfName">Nombre completo</label>
              <input type="text" id="pfName" name="name" value="Cliente Avante">
            </div>
            <div class="field">
              <label for="pfEmail">Correo electrónico</label>
              <input type="email" id="pfEmail" name="email" value="cliente@avanteoptics.mx">
            </div>
            <div class="field">
              <label for="pfPhone">Teléfono</label>
              <input type="tel" id="pfPhone" name="phone" placeholder="(662) 000 0000">
            </div>
            <div class="field">
              <label>Preferencia de contacto</label>
              <div class="pill-options">
                <label class="pill-option">
                  <input type="radio" name="contactPref" checked>
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.4 2 12c0 1.9.5 3.6 1.4 5.1L2 22l5.1-1.3A10 10 0 0 0 12 22c5.5 0 10-4.4 10-10S17.5 2 12 2Z"/></svg>
                  WhatsApp
                </label>
                <label class="pill-option">
                  <input type="radio" name="contactPref">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
                  Correo
                </label>
              </div>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn solid small">Guardar cambios</button>
          </div>
        </form>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Seguridad</h2>
        <p>Cambia tu contraseña de acceso.</p>
      </div>
      <div class="panel-body">
        <form>
          <div class="field-grid">
            <div class="field full">
              <label for="pfCurrentPass">Contraseña actual</label>
              <input type="password" id="pfCurrentPass" placeholder="••••••••">
            </div>
            <div class="field">
              <label for="pfNewPass">Nueva contraseña</label>
              <input type="password" id="pfNewPass" placeholder="••••••••">
            </div>
            <div class="field">
              <label for="pfConfirmPass">Confirmar nueva contraseña</label>
              <input type="password" id="pfConfirmPass" placeholder="••••••••">
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn small">Actualizar contraseña</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="static/js/client/sidebar.js"></script>
<script src="static/js/client/userbar.js"></script>
<script src="static/js/client/mi-perfil.js"></script>
</body>
</html>
