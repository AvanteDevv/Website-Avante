<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis favoritos — Avante Optics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/client/userbar.css">
<link rel="stylesheet" href="static/css/client/sidebar.css">
<link rel="stylesheet" href="static/css/client/mis-favoritos.css">
</head>
<body class="cuenta-body">

{{template "userbar" .}}

<div class="cuenta-shell">
  {{template "sidebar" .}}


  <main class="cuenta-main">
    <div class="cuenta-header">
      <h1>Mis favoritos</h1>
      <p>Los armazones que has guardado desde el Directorio y la tienda en línea.</p>
    </div>

    <div class="fav-grid" id="favGrid"></div>

    <div class="empty-state" id="favEmptyState" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <p>Todavía no tienes armazones guardados. Explora el directorio o la tienda en línea y guarda los que más te gusten.</p>
      <a href="/tienda" class="btn solid small">Ir a la tienda</a>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="static/js/client/sidebar.js"></script>
<script src="static/js/client/userbar.js"></script>
<script src="static/js/client/mis-favoritos.js"></script>
</body>
</html>
