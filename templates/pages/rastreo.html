<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastrea tu pedido — Avante Optics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

{{template "navbar" .}}

<section class="strip" id="tracking">
  <div class="tracking-blob b1"></div>
  <div class="tracking-blob b2"></div>
  <div class="section-head reveal-blur">
    <div class="eyebrow"><svg class="eyebrow-glasses" viewBox="0 0 34 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="6"/><circle cx="27" cy="7" r="6"/><path d="M13 7h8"/></svg>Seguimiento<svg class="eyebrow-glasses" viewBox="0 0 34 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="6"/><circle cx="27" cy="7" r="6"/><path d="M13 7h8"/></svg></div>
    <h2>¿Cómo va tu pedido?</h2>
    <p>Ingresa tu número de orden para ver el estado de tu compra.</p>
  </div>
  <div class="tracking-wrap">
    <div class="tracking-card reveal-rise">
      <div class="tracking-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>Rastreo en tiempo real</div>
      <div class="tracking-search">
        <div class="tracking-search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <input type="text" id="trackingInput" placeholder="Número de pedido, ej. AVT-10493">
        </div>
        <button class="btn solid" id="trackingBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          Rastrear pedido
        </button>
      </div>
      <p class="tracking-error" id="trackingError"></p>
      <div class="tracking-result" id="trackingResult">
        <div class="tracking-order-info">
          <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Pedido <strong id="trackingOrderNum">—</strong></span>
          <span class="chip eta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="trackingEta">Entrega estimada: —</span></span>
        </div>
        <div class="tracking-steps" id="trackingSteps">
          <div class="tracking-progress" id="trackingProgress"></div>
        </div>
      </div>
    </div>
  </div>
</section>

{{template "footer" .}}

<script src="/static/js/pages/rastreo.js"></script>
<script src="/static/js/partials/footer.js"></script>
<a href="https://wa.me/526622561704?text=Hola%2C%20me%20gustar%C3%ADa%20m%C3%A1s%20informaci%C3%B3n" class="whatsapp-float" target="_blank" rel="noopener" aria-label="Contáctanos por WhatsApp">
  <span class="whatsapp-float-ring"></span>

</body>
</html>
