<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Avante Optics Admin</title>
<link rel="icon" type="image/png" href="/static/images/avante-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/auth-admin/admin-login.css">
</head>
<body class="admin-body">

<div class="admin-login-wrap is-solo">
  <div class="admin-login-form-side">
    <div class="admin-login-card">
      <div class="admin-login-brand">
        <img src="/static/images/avante-logo.png" alt="" width="56" height="56">
        <span>Avante Optics</span>
      </div>
      <div class="eyebrow">Panel de administración</div>
      <h1>Bienvenido de vuelta</h1>
      <p class="sub">Inicia sesión para continuar</p>

      <form id="adminLoginForm" novalidate>
        <div class="admin-field">
          <label for="adminEmail">Correo electrónico</label>
          <div class="admin-field-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input type="email" id="adminEmail" autocomplete="username" required>
          </div>
        </div>
        <div class="admin-field">
          <label for="adminPassword">Contraseña</label>
          <div class="admin-field-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="adminPassword" autocomplete="current-password" required>
            {{/* Ojo animado: parpadea al tocarlo y una línea lo tacha cuando la contraseña se ve. */}}
            <button type="button" class="admin-field-toggle pw-eye" id="adminPasswordToggle" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <g class="pw-eye-ball">
                  <path class="pw-eye-shape" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                  <circle class="pw-eye-pupil" cx="12" cy="12" r="3"/>
                </g>
                <path class="pw-eye-slash" d="M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="admin-login-error" id="adminLoginError"></div>
        <button type="submit" class="btn solid">INICIAR SESIÓN</button>
      </form>
    </div>
  </div>
</div>

<script src="/js/auth-admin/admin-login.js"></script>

</body>
</html>
