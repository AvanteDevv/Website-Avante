<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen — Optometría · Avante Optics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/admin/userbar.css">
<link rel="stylesheet" href="/static/css/admin/sidebar.css">
<link rel="stylesheet" href="/static/css/optometrist/examen-vista.css">
<link rel="stylesheet" href="/static/css/optometrist/examen-render.css">
</head>
<body class="cuenta-body" data-exam-id="{{.ExamID}}">

{{template "optometrist-userbar" .}}

<div class="cuenta-shell">
  {{template "optometrist-sidebar" .}}

  <main class="cuenta-main">
    <div class="cuenta-header admin-header-row">
      <div>
        <h1>Examen</h1>
        <p id="examMeta" class="exf-meta"></p>
      </div>
      <div class="admin-header-actions">
        <a href="/optometrist/examen-vista" class="btn thin">Volver</a>
      </div>
    </div>

    <p class="tpl-status" id="examStatus"></p>

    <div class="exf-canvas-wrap">
      <div id="examCanvas"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="/static/js/admin/sidebar.js"></script>
<script src="/static/js/admin/userbar.js"></script>
<script src="/static/js/optometrist/examen-render.js"></script>
<script src="/static/js/optometrist/ver-examen.js"></script>
</body>
</html>
