<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Admin · Avante Optics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Public+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/admin/userbar.css">
<link rel="stylesheet" href="/static/css/admin/sidebar.css">
<link rel="stylesheet" href="/static/css/admin/pedidos.css">
</head>
<body class="cuenta-body admin-body">

{{template "admin-userbar" .}}

<div class="cuenta-shell">
  {{template "admin-sidebar" .}}

  <main class="cuenta-main admin-main">
    <div class="admin-header">
      <div>
        <h1>Pedidos</h1>
        <p>Datos de ejemplo — el sitio público aún no tiene un carrito de compras real. Conecta tu tienda/backend para ver pedidos verdaderos aquí.</p>
      </div>
    </div>

    <div class="admin-stats">
      <div class="admin-stat-card">
        <div class="num" id="pedidosCount">0</div>
        <div class="label">Pedidos (ejemplo)</div>
      </div>
    </div>

    <div class="admin-panel">
      <div class="admin-panel-head">
        <h2>Todos los pedidos</h2>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Pedido</th>
              <th>Cliente</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="pedidosTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="/static/js/admin/sidebar.js"></script>
<script src="/static/js/admin/userbar.js"></script>
<script src="/static/js/admin/pedidos.js"></script>
</body>
</html>
